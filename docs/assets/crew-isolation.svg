<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img">
  <defs>
  <style>
    svg { --ink:#1f2328; --muted:#59636e; --line:#c9d1d9; --surface:#f6f8fa;
          --card:#ffffff; --cardline:#d1d9e0;
          --accent:#0969da; --accentink:#ffffff;
          --ok:#1a7f37; --okbg:#dafbe1; --warn:#9a6700; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#e6edf3; --muted:#9198a1; --line:#444c56; --surface:#151b23;
            --card:#0d1117; --cardline:#3d444d;
            --accent:#4493f8; --accentink:#0d1117;
            --ok:#3fb950; --okbg:#12261e; --warn:#d29922; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hd  { font-size:10px; letter-spacing:1.3px; fill:var(--muted); font-weight:600; }
    .lbl { font-size:13.5px; fill:var(--ink); }
    .lblb{ font-size:13.5px; fill:var(--ink); font-weight:600; }
    .sub { font-size:11px; fill:var(--muted); }
    .cap { font-size:11.5px; fill:var(--muted); }
    .edge{ fill:none; stroke:var(--line); stroke-width:1.5; stroke-linecap:round; }
    .box { fill:var(--surface); stroke:var(--line); stroke-width:1; }
    .dash{ fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 4; }
  </style>
  <marker id="ar" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7.2"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0 0 L10 4 L0 8 Z" fill="var(--line)"/>
  </marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="259" rx="14" fill="var(--card)" stroke="var(--cardline)"/>
  <title>Isolation: write runs happen in a separate git worktree; nothing reaches your branch until you approve.</title>
  <text class="cap" x="32" y="36">Your working tree is never written to. The run happens somewhere else until you say otherwise.</text>
  <rect class="box" x="32" y="96" width="228" height="64" rx="10"/>
  <text class="lblb" x="146" y="123" text-anchor="middle">crew write run</text>
  <text class="sub m" x="146" y="143" text-anchor="middle">~/.crew/runs/&lt;id&gt;/worktree</text>
  <path class="edge" d="M260 128 H320" marker-end="url(#ar)"/>
  <rect class="box" x="320" y="104" width="190" height="48" rx="10"/>
  <text class="lblb" x="415" y="133" text-anchor="middle">you inspect the diff</text>
  <path class="edge" d="M510 128 H538 Q550 128 550 116 V96 Q550 84 562 84 H580" marker-end="url(#ar)"/>
  <path class="edge" d="M510 128 H538 Q550 128 550 140 V160 Q550 172 562 172 H580" marker-end="url(#ar)"/>
  <rect x="584" y="58" width="364" height="52" rx="10" fill="var(--okbg)" stroke="var(--ok)" stroke-width="1.5"/>
  <text class="m" x="604" y="82" font-size="12.5" font-weight="600" fill="var(--ok)">merge_run</text>
  <text class="sub" x="604" y="99">squash-merged onto your branch as one commit</text>
  <rect class="box" x="584" y="146" width="364" height="52" rx="10"/>
  <text class="m" x="604" y="170" font-size="12.5" font-weight="600" fill="var(--muted)">discard_run</text>
  <text class="sub" x="604" y="187">worktree thrown away, your checkout untouched</text>
  <text class="cap" x="32" y="232">Read-only reviewers inspect an existing checkout in place. <tspan class="m">agy</tspan> gets a disposable, non-mergeable snapshot — Antigravity cannot enforce read-only.</text>
</svg>
