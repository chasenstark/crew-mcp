<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img">
  <defs>
  <style>
    svg { --ink:#1f2328; --muted:#59636e; --line:#c9d1d9; --surface:#f6f8fa;
          --card:#ffffff; --cardline:#d1d9e0;
          --accent:#0969da; --accentink:#ffffff;
          --ok:#1a7f37; --okbg:#dafbe1; --warn:#9a6700; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#e6edf3; --muted:#9198a1; --line:#444c56; --surface:#151b23;
            --card:#0d1117; --cardline:#3d444d;
            --accent:#4493f8; --accentink:#0d1117;
            --ok:#3fb950; --okbg:#12261e; --warn:#d29922; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hd  { font-size:10px; letter-spacing:1.3px; fill:var(--muted); font-weight:600; }
    .lbl { font-size:13.5px; fill:var(--ink); }
    .lblb{ font-size:13.5px; fill:var(--ink); font-weight:600; }
    .sub { font-size:11px; fill:var(--muted); }
    .cap { font-size:11.5px; fill:var(--muted); }
    .edge{ fill:none; stroke:var(--line); stroke-width:1.5; stroke-linecap:round; }
    .box { fill:var(--surface); stroke:var(--line); stroke-width:1; }
    .dash{ fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:4 4; }
  </style>
  <marker id="ar" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7.2"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0 0 L10 4 L0 8 Z" fill="var(--line)"/>
  </marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="339" rx="14" fill="var(--card)" stroke="var(--cardline)"/>
  <title>Crew fan-out: one conversation dispatches many agents, each isolated, and you approve what merges.</title>
  <text class="hd" x="162" y="52" text-anchor="middle">ONE CONVERSATION</text>
  <text class="hd" x="442" y="52" text-anchor="middle">AGENTS</text>
  <text class="hd" x="660" y="52" text-anchor="middle">ISOLATION</text>
  <text class="hd" x="874" y="52" text-anchor="middle">YOUR CALL</text>
  <rect class="box" x="24" y="163" width="72" height="40" rx="20"/>
  <text class="lbl" x="60" y="188" text-anchor="middle">you</text>
  <path class="edge" d="M100 183 H140" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="144" y="153" width="156" height="60" rx="10" fill="var(--accent)"/>
  <text x="222" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="var(--accentink)">captain</text>
  <text x="222" y="196" text-anchor="middle" font-size="11" fill="var(--accentink)" opacity="0.82">your host CLI</text>
  <path class="edge" d="M300 183 H328"/>
  <path class="edge" d="M328 183 V98 Q328 90 336 90 H356" marker-end="url(#ar)"/>
  <rect class="box" x="356" y="68" width="172" height="44" rx="9"/>
  <text class="lbl" x="442" y="95" text-anchor="middle">Claude Code</text>
  <path class="edge" d="M528 90 H588" marker-end="url(#ar)"/>
  <rect class="dash" x="588" y="68" width="144" height="44" rx="9"/>
  <text class="sub m" x="660" y="94" text-anchor="middle">isolated worktree</text>
  <path class="edge" d="M732 90 H752 Q760 90 760 98 V183"/>
  <path class="edge" d="M328 183 V160 Q328 152 336 152 H356" marker-end="url(#ar)"/>
  <rect class="box" x="356" y="130" width="172" height="44" rx="9"/>
  <text class="lbl" x="442" y="157" text-anchor="middle">Codex</text>
  <path class="edge" d="M528 152 H588" marker-end="url(#ar)"/>
  <rect class="dash" x="588" y="130" width="144" height="44" rx="9"/>
  <text class="sub m" x="660" y="156" text-anchor="middle">isolated worktree</text>
  <path class="edge" d="M732 152 H752 Q760 152 760 160 V183"/>
  <path class="edge" d="M328 183 V206 Q328 214 336 214 H356" marker-end="url(#ar)"/>
  <rect class="box" x="356" y="192" width="172" height="44" rx="9"/>
  <text class="lbl" x="442" y="213" text-anchor="middle">agy · Antigravity</text>
  <text x="442" y="228" text-anchor="middle" font-size="10.5" fill="var(--muted)">Gemini models</text>
  <path class="edge" d="M528 214 H588" marker-end="url(#ar)"/>
  <rect class="dash" x="588" y="192" width="144" height="44" rx="9"/>
  <text class="sub m" x="660" y="218" text-anchor="middle">throwaway snapshot</text>
  <path class="edge" d="M732 214 H752 Q760 214 760 206 V183"/>
  <path class="edge" d="M328 183 V268 Q328 276 336 276 H356" marker-end="url(#ar)"/>
  <rect class="box" x="356" y="254" width="172" height="44" rx="9"/>
  <text class="lbl" x="442" y="281" text-anchor="middle">local models</text>
  <path class="edge" d="M528 276 H588" marker-end="url(#ar)"/>
  <rect class="dash" x="588" y="254" width="144" height="44" rx="9"/>
  <text class="sub m" x="660" y="280" text-anchor="middle">no repo access</text>
  <path class="edge" d="M732 276 H752 Q760 276 760 268 V183"/>
  <path class="edge" d="M760 183 H790" marker-end="url(#ar)"/>
  <rect x="790" y="155" width="168" height="56" rx="10" fill="var(--okbg)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="874" y="178" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--ok)">you approve</text>
  <text class="sub" x="874" y="196" text-anchor="middle">merged to your branch</text>
</svg>
